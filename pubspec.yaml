name: foot_path
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  hive_ce: ^2.19.3
  pedometer: ^4.2.0
  hive_ce_flutter: ^2.3.4
  fl_chart: ^1.2.0
  dynamic_color: ^1.8.1
  permission_handler: ^12.0.3
  flutter_foreground_task: ^10.0.0
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  equatable: ^2.1.0
  get_it: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  hive_ce_generator: ^1.11.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:

  uses-material-design: true

  assets:
    - assets/images/icon-only.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon-only.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/icon-only.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/images/icon-only.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/icon-only.png"